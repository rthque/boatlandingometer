# Rotation complète du mot de passe de la 3D (/3D/ et /3D/test/), sans le code source privé.
# Procédure pour Quentin : CLAUDE.md, « Changer le mot de passe depuis GitHub ».
#
# Sécurité, parce que le dépôt et ses logs sont publics :
# - aucun champ de saisie : les deux mots de passe ne viennent que des secrets
#   BLM3D_PASSWORD_OLD et BLM3D_PASSWORD_NEW, et seule l'étape « Rotation » les reçoit ;
# - le script ne les affiche jamais, ne les écrit jamais sur disque et, en cas d'erreur,
#   n'imprime qu'un message fixe choisi d'avance (jamais l'erreur d'origine ni sa pile) ;
# - le workflow ne pousse jamais sur main : il pousse une branche neuve et donne, dans
#   son résumé, le lien pour ouvrir la PR.
name: Changer le mot de passe 3D

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-3d-password
  cancel-in-progress: false

jobs:
  rotate:
    # Seule la version de main de ce fichier peut tourner.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rotation
        env:
          BLO_OLD: ${{ secrets.BLM3D_PASSWORD_OLD }}
          BLO_NEW: ${{ secrets.BLM3D_PASSWORD_NEW }}
        run: |
          node --input-type=module - public/3D/test public/3D <<'SCRIPT'
          // Same rotation as PR #29: one new vault (id, salt, check) for every folder, runtime and every
          // asset re-encrypted with fresh IVs and file names, same PBKDF2 iterations. The password is the
          // UTF-8 bytes of its NFC form, nothing trimmed, exactly as unlock.js derives it.
          import {readFile,writeFile,readdir,rm,mkdir,rename} from 'node:fs/promises';
          import path from 'node:path';import {randomBytes,createHash,webcrypto as crypto} from 'node:crypto';import {gzipSync,gunzipSync} from 'node:zlib';
          class Say extends Error{} // the only messages ever printed: fixed text, no data
          const fail=m=>{throw new Say(m);};
          const quiet=e=>{console.log('::error::'+(e instanceof Say?e.message:'Échec inattendu ; détail masqué pour ne rien exposer. Relancer, puis prévenir Claude.'));process.exit(1);};
          process.on('uncaughtException',quiet);process.on('unhandledRejection',quiet);
          const OLD=process.env.BLO_OLD??'',NEW=process.env.BLO_NEW??'';delete process.env.BLO_OLD;delete process.env.BLO_NEW;
          const CHECK='Boatlandingometer team access v1',FILE=/^assets\/[a-f0-9]{32}\.bin$/,ITER=600000;
          const enc=new TextEncoder(),b64=x=>Buffer.from(x).toString('base64'),bytes=s=>Buffer.from(s,'base64');
          const pwBytes=p=>enc.encode(p.normalize('NFC')),aad=(id,n)=>enc.encode(`boatlandingometer-v1:${id}:${n}`);
          const keyFor=async(p,salt,it)=>crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},await crypto.subtle.importKey('raw',pwBytes(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
          const open=(k,id,n,iv,d)=>crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(iv),additionalData:aad(id,n),tagLength:128},k,d).then(Buffer.from);
          async function readSite(dir,pw){
           const v=JSON.parse(await readFile(path.join(dir,'protected/vault.json'),'utf8'));
           if(v.version!==1||!FILE.test(v.runtime?.file??'')||v.iterations<200000||v.iterations>2000000)fail(dir+' : coffre illisible.');
           const key=await keyFor(pw,bytes(v.salt),v.iterations);
           const c=await open(key,v.id,'check',v.check.iv,bytes(v.check.data)).catch(()=>null);
           if(c?.toString()!==CHECK)return null;
           const packed=await open(key,v.id,'/runtime/application',v.runtime.iv,await readFile(path.join(dir,'protected',v.runtime.file)));
           if(packed.length!==v.runtime.size)fail(dir+' : runtime de taille inattendue.');
           const app=JSON.parse(gunzipSync(packed));if(app.version!==1||app.vault?.id!==v.id)fail(dir+' : runtime incohérent.');
           const assets=[];for(const a of app.vault.assets){if(!FILE.test(a.file))fail(dir+' : nom de fichier inattendu.');const p=await open(key,v.id,a.path,a.iv,await readFile(path.join(dir,'protected',a.file)));if(p.length!==a.size)fail(dir+' : ressource de taille inattendue.');assets.push({...a,plain:p});}
           const disk=(await readdir(path.join(dir,'protected/assets'))).map(n=>'assets/'+n).sort(),listed=[...new Set([v.runtime.file,...app.vault.assets.map(a=>a.file)])].sort();
           if(JSON.stringify(disk)!==JSON.stringify(listed))fail(dir+' : fichiers chiffrés non listés par le coffre.');
           return {dir,v,app,assets};
          }
          // 1. The two secrets.
          if(!OLD||!NEW)fail('Secret manquant : créer BLM3D_PASSWORD_OLD et BLM3D_PASSWORD_NEW (Settings > Secrets and variables > Actions).');
          if(OLD.normalize('NFC')===NEW.normalize('NFC'))fail('Les deux secrets sont identiques : BLM3D_PASSWORD_NEW doit être le nouveau mot de passe.');
          if([...NEW.normalize('NFC')].length<14)fail('Nouveau mot de passe trop court : au moins 14 caractères.');
          // 2. Read everything with the current password (memory only).
          const dirs=process.argv.slice(2).map(d=>path.resolve(d)),sites=[];
          for(const d of dirs){const s=await readSite(d,OLD);if(!s)fail('BLM3D_PASSWORD_OLD est refusé par le coffre actuel : ce n\'est pas le mot de passe en service.');sites.push(s);}
          // 3. One new vault; nothing taken over from the old one.
          const old=new Set(sites.flatMap(s=>[s.v.id,s.v.salt,s.v.runtime.iv,s.v.runtime.file,s.v.check.iv,...s.app.vault.assets.flatMap(a=>[a.iv,a.file])])),fresh=new Set();
          const uniq=make=>{for(;;){const x=make();if(!old.has(x)&&!fresh.has(x)){fresh.add(x);return x;}}};
          const id=uniq(()=>randomBytes(16).toString('hex')),salt=uniq(()=>b64(randomBytes(32))),key=await keyFor(NEW,bytes(salt),ITER);
          const seal=async(n,plain)=>{const iv=uniq(()=>b64(randomBytes(12)));return{iv,data:Buffer.from(await crypto.subtle.encrypt({name:'AES-GCM',iv:bytes(iv),additionalData:aad(id,n),tagLength:128},key,plain))};};
          const newFile=()=>uniq(()=>'assets/'+randomBytes(16).toString('hex')+'.bin');
          const c=await seal('check',Buffer.from(CHECK)),check={iv:c.iv,data:b64(c.data)};
          const shared=new Map(),out=[];
          for(const s of sites){const files=new Map(),assets=[];
           for(const a of s.assets){const k=a.path+'\0'+createHash('sha256').update(a.plain).digest('hex');let e=shared.get(k);if(!e){const x=await seal(a.path,a.plain);e={file:newFile(),iv:x.iv,data:x.data};shared.set(k,e);}files.set(e.file,e.data);assets.push({path:a.path,file:e.file,iv:e.iv,type:a.type,size:a.size});}
           const vault={version:1,id,salt,iterations:ITER,check,assets};
           const packed=gzipSync(Buffer.from(JSON.stringify({...s.app,vault})),{level:9}),r=await seal('/runtime/application',packed),rf=newFile();files.set(rf,r.data);
           out.push({s,files,lock:{version:1,id,salt,iterations:ITER,check,runtime:{file:rf,iv:r.iv,size:packed.length}}});}
          // 4. Nothing in clear and neither password inside anything about to be written.
          const needles=[...new Set([OLD,NEW,OLD.normalize('NFC'),NEW.normalize('NFC')])].map(p=>Buffer.from(p,'utf8'));
          const entropy=b=>{const n=new Array(256).fill(0);for(const x of b)n[x]++;return -n.reduce((h,c)=>c?h+c/b.length*Math.log2(c/b.length):h,0);};
          for(const {files,lock} of out){for(const d of files.values()){if(d.length>=4096&&entropy(d)<7.9)fail('Contrôle « rien en clair » échoué : rien n\'a été poussé.');if(needles.some(n=>d.includes(n)))fail('Contrôle de fuite échoué : rien n\'a été poussé.');}
           if(needles.some(n=>Buffer.from(JSON.stringify(lock)).includes(n)))fail('Contrôle de fuite échoué : rien n\'a été poussé.');}
          // 5. Write, then read back from disk: new accepted, old refused, same plaintext.
          for(const {s,files,lock} of out){const prot=path.join(s.dir,'protected'),tmp=prot+'.rotating';await rm(tmp,{recursive:true,force:true});await mkdir(path.join(tmp,'assets'),{recursive:true});
           for(const [f,d] of files)await writeFile(path.join(tmp,f),d);await writeFile(path.join(tmp,'vault.json'),JSON.stringify(lock));await rm(prot,{recursive:true,force:true});await rename(tmp,prot);}
          for(const {s} of out){const n=await readSite(s.dir,NEW);if(!n)fail('Le nouveau mot de passe n\'ouvre pas le nouveau coffre : rien n\'a été poussé.');
           if(await readSite(s.dir,OLD))fail('L\'ancien mot de passe ouvre encore le coffre : rien n\'a été poussé.');
           const code=a=>JSON.stringify({...a,vault:null});if(code(n.app)!==code(s.app)||n.assets.length!==s.assets.length||n.assets.some((a,i)=>!a.plain.equals(s.assets[i].plain)||a.path!==s.assets[i].path))fail('Contenu déchiffré différent : rien n\'a été poussé.');}
          console.log(`Rotation vérifiée : ${out.length} dossiers, un seul nouveau coffre, nouveau mot de passe accepté, ancien refusé, contenu identique.`);
          SCRIPT

      - name: Contrôle du diff
        run: |
          git add -A public/3D
          extra=$(git status --porcelain | grep -v -E '^(A|D|M)  public/3D/(test/)?protected/(vault\.json|assets/[0-9a-f]{32}\.bin)$' || true)
          if [ -n "$extra" ]; then echo "::error::Fichiers inattendus modifiés ; rien n'a été poussé."; exit 1; fi
          git diff --cached --quiet && { echo "::error::Aucun changement ; rien n'a été poussé."; exit 1; } || true

      - name: Pousser la branche
        env:
          TOKEN: ${{ github.token }}
        run: |
          branch="rotation-3d-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "3D : rotation complète du mot de passe (workflow ${GITHUB_RUN_NUMBER})"
          # The token goes to git through the environment only: no command line, nothing printed.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push -q origin "HEAD:refs/heads/$branch"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1&title=3D%20%3A%20rotation%20du%20mot%20de%20passe"
          {
            echo "## Rotation prête : branche \`$branch\`"
            echo
            echo "Nouveau mot de passe accepté, ancien refusé, rien en clair."
            echo
            echo "**[Ouvrir la PR]($url)**, puis la fusionner."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Ouvrir la PR : $url"
