<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boatlandingometer — Dieppe tides</title>
    <meta
      name="description"
      content="Dieppe tide times overlaid on the jacket structure and boat landing (chart datum)."
    />

    <!-- Icons are generated from assets/icon-source.png by
         npm run icons — don't edit them by hand. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#2d6799" />

    <meta property="og:title" content="Boatlandingometer — Dieppe tides" />
    <meta
      property="og:description"
      content="Dieppe tide times overlaid on the jacket structure and boat landing (chart datum)."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boatlandingometer.info/" />
    <!-- Absolute: social crawlers don't resolve relative URLs. -->
    <meta property="og:image" content="https://boatlandingometer.info/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://boatlandingometer.info/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Resolve the theme before first paint, otherwise someone who chose night
         gets a white flash while the bundle loads. Kept in sync with
         src/hooks/use-theme.ts (same storage key, same rule).

         Day is the default, always: night is on only when the toggle has
         explicitly saved it. prefers-color-scheme is deliberately not consulted
         — an OS that switches itself to dark in the evening would otherwise
         decide the theme for a first-time visitor. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("blo-theme") === "night") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* storage blocked — day, same as any first visit */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
